name: CI
on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    - labeled
    - unlabeled
  workflow_dispatch:
    inputs:
      major_release:
        description: Run major-release validation
        type: boolean
        default: false
  push:
    tags:
    - v*
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17
        cache: gradle
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools platforms;android-36 build-tools;36.0.0
    - run: ./gradlew --build-cache --parallel testDebugUnitTest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 2 || 10 }}
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17
        cache: gradle
    - name: Enable KVM acceleration
      run: sudo chmod a+rw /dev/kvm
    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        arch: x86_64
        disable-animations: true
        script: ./gradlew connectedDebugAndroidTest
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.major_release) || contains(github.event.pull_request.labels.*.name, 
      'major-release') || (startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '.0.0')) }}
  release:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17
        cache: gradle
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools platforms;android-36 build-tools;36.0.0
    - run: ./gradlew --build-cache --parallel assembleRelease
    timeout-minutes: 10
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.major_release) || contains(github.event.pull_request.labels.*.name, 
      'major-release') || startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
